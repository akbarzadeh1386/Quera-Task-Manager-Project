<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="./output.css" rel="stylesheet">
</head>

<body class=" bg-[#F5F6F8] min-h-screen">
  <header dir="rtl" class=" flex items-center justify-between rounded-lg bg-surface-light px-4 py-3 ">
    <button type="button"
      class="grid size-6 place-items-center rounded-lg hover:bg-primary-hover-light/10 active:bg-primary-hover-light/15"
      aria-label="menu">
      <img src="../icons/Frame 12161.svg" alt="hamburger-menu" class="size-6 md:hidden">
    </button>
    <h1 class="text-[#000000] ">
      کوئرا لیست
    </h1>
    <span class="size-6" aria-hidden="true"></span>
  </header>


  <!-- sidebar section -->

  <div id="overlay" class="fixed inset-0 bg-black/40 z-30  md:hidden"></div>

  <aside class=" fixed top-0 right-0 bottom-0  w-64 bg-white p-5 z-40
         md:flex flex-col
         rounded-2xl shadow-2xs overflow-hidden md:m-5">

    <div class="hidden  md:flex flex-col md:px-5 py-5 mt-2">
      <img src="../images/Ellipse 136.png" alt="avatar" class="size-12 rounded-full object-cover">
      <div class="flex-1">
        <p class="text-[18px] text-[#000000] font-extrabold ">سلام رویا</p>
        <p class="text-[14px] text-[#C8C7CB] ">امروز، سه شنبه 5بهمن1403</p>
      </div>

    </div>
    <div class="flex justify-between items-center -translate-y-40 mx-auto w-60 px-5 md:hidden ">
      <h1 class="font-bold text-[16px] tetx-[#292D32]">کوئرا لیست</h1>
      <img src="../icons/24-support.svg" alt="x-mark" class="w-4 text-[#242424] ">
    </div>
    <div class="flex flex-col ">
      <ul class="cursor-pointer text-[#525252] leading-12 font['YekanBakh']">
        <li class="flex gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/home-angle-2-svgrepo-com.svg" alt="home" class="w-5 ">
          <h3 class="w-11.75">خانه</h3>
        </li>
        <li class="flex gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/task-square.svg" alt="tasks">
          <h3>تسک ها</h3>
        </li>
        <li class="flex gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/calendar.svg" alt="calendar" class="w-5">
          <h3 class="w-11.75">تقویم</h3>
        </li>
        <li class="flex gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/arrange-square-2.svg" alt="arrange">
          <h3 class="">گزارشات</h3>
        </li>
        <li class="flex gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/setting.svg" alt="setting" class="w-5">
          <h3 class="w-11.75">تنظیمات</h3>
        </li>
        <li class="flex gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/24-support.svg" alt="support">
          <h3 class="w-11.75">پشتیبانی</h3>
        </li>
        <li class="flex  gap-2 hover:bg-[#F5FAFF] hover:text-[#007BFF]">
          <img src="../icons/profile.svg" alt="profile">
          <h3 class="w-11.75">پروفایل</h3>
        </li>
      </ul>
      <div class="bg-[#f7f7f7] rounded-lg w-52 h-11 mt-16">
        <ul class="flex justify-around  gap-4 text-[#525252] p-1">
          <li class="flex gap-2 items-center bg-[#ffffff] rounded p-1 w-1/2">
            <img src="../icons/sun.svg" alt="sun">
            <h3>روشن</h3>
          </li>
          <li class="flex items-center gap-2">
            <img src="../icons/moon.svg" alt="moon">
            <h3>تاریک</h3>
          </li>
        </ul>
      </div>
      <div class="w-[80%] h-px  bg-[#E9E9E9] mx-auto"></div>
      <div class="flex items-center gap-4 mt-3 text-[#525252]">
        <img src="../icons/logout.svg" alt="log out">
        <h3>خروج</h3>
      </div>
    </div>


  </aside>


  <script src="./src/scripts/main.js"></script>
</body>

</html>
